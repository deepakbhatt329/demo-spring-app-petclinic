name: SonarCloud + IDP quality forward

on:
  push:
    branches: [main, demo-setup]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar-scan:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

  forward-quality:
    name: Forward SonarCloud measures to IDP
    needs: sonar-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for SonarCloud to finish indexing
        run: sleep 30
      - name: Fetch measures from SonarCloud
        id: measures
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          curl -sSf \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,reliability_rating,security_rating,sqale_rating" \
            > measures.json
          cat measures.json
      - name: Build + POST quality record to IM
        env:
          HARNESS_IM_URL:       ${{ secrets.HARNESS_IM_URL }}
          HARNESS_ACCOUNT_ID:   ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_API_KEY:      ${{ secrets.HARNESS_API_KEY }}
          IID_QUALITY:          ${{ secrets.IID_QUALITY }}
          SONAR_PROJECT_KEY:    ${{ secrets.SONAR_PROJECT_KEY }}
          IDP_ENTITY_REF:       component:default/petclinic-demo
        run: |
          set -euo pipefail
          RATING_MAP='{"1.0":"A","2.0":"B","3.0":"C","4.0":"D","5.0":"E"}'
          BODY=$(jq -n \
            --slurpfile m measures.json \
            --arg id "sonar-petclinic-latest" \
            --arg name "petclinic SonarCloud" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ref "$IDP_ENTITY_REF" \
            --arg url "https://sonarcloud.io/summary/new_code?id=${SONAR_PROJECT_KEY}" \
            --argjson rmap "$RATING_MAP" \
            '
            def toNum(k): ($m[0].component.measures[] | select(.metric == k) | .value | tonumber?);
            def toInt(k): ($m[0].component.measures[] | select(.metric == k) | .value | tonumber? | floor);
            def toRating(k): ($m[0].component.measures[] | select(.metric == k) | .value) as $v
              | if $v == null then null else $rmap[$v] end;
            {records: [{
              identifier: $id,
              name: $name,
              service: "petclinic",
              entity_ref: $ref,
              timestamp: $ts,
              url: $url,
              status: "OK",
              coverage: toNum("coverage"),
              duplicatedLinesDensity: toNum("duplicated_lines_density"),
              bugs: toInt("bugs"),
              vulnerabilities: toInt("vulnerabilities"),
              codeSmells: toInt("code_smells"),
              reliabilityRating: toRating("reliability_rating"),
              securityRating: toRating("security_rating"),
              maintainabilityRating: toRating("sqale_rating")
            }]}
            ')
          echo "$BODY" | jq .
          curl -sSf -X POST \
            -H "Authorization: Bearer ${HARNESS_API_KEY}" \
            -H "Content-Type: application/json" \
            "${HARNESS_IM_URL}/api/v1/accounts/${HARNESS_ACCOUNT_ID}/integrations/${IID_QUALITY}/data/quality" \
            -d "$BODY"
