controller:
  installPlugins:
    - kubernetes:4283.v87f2b_5b_9f8a_a
    - workflow-aggregator:600.vb_57cdd26fbf1
    - git:5.2.2
    - configuration-as-code:1836.vccda_4a_122a_a_e
    - job-dsl:1.87
    - credentials-binding:687.v619cb_15e923f
    - http_request:1.19
    - pipeline-utility-steps:2.19.0
    - workflow-cps-global-lib:609.vd95673f149b_b

  serviceType: ClusterIP

  additionalExistingSecrets:
    - name: harness-idp-secrets
      keyName: HARNESS_IM_URL
    - name: harness-idp-secrets
      keyName: HARNESS_ACCOUNT_ID
    - name: harness-idp-secrets
      keyName: HARNESS_API_KEY
    - name: harness-idp-secrets
      keyName: IID_BUILD
    - name: harness-idp-secrets
      keyName: IID_DEPLOYMENT
    - name: harness-idp-secrets
      keyName: IID_QUALITY
    - name: harness-idp-secrets
      keyName: IID_SECURITY
    - name: harness-idp-secrets
      keyName: IID_CUSTOM
    - name: harness-idp-secrets
      keyName: GHCR_USERNAME
    - name: harness-idp-secrets
      keyName: GHCR_TOKEN

  JCasC:
    defaultConfig: true
    configScripts:
      demo-config: |
        jenkins:
          systemMessage: "IDP Custom Integration demo — provisioned via JCasC"
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      scope: GLOBAL
                      id: harness-api-key
                      secret: "${HARNESS_API_KEY}"
                      description: "Harness dev PAT (Bearer)"
                  - string:
                      scope: GLOBAL
                      id: harness-account-id
                      secret: "${HARNESS_ACCOUNT_ID}"
                      description: "Harness dev account id"
                  - string:
                      scope: GLOBAL
                      id: iid-build
                      secret: "${IID_BUILD}"
                  - string:
                      scope: GLOBAL
                      id: iid-deployment
                      secret: "${IID_DEPLOYMENT}"
                  - string:
                      scope: GLOBAL
                      id: iid-quality
                      secret: "${IID_QUALITY}"
                  - string:
                      scope: GLOBAL
                      id: iid-security
                      secret: "${IID_SECURITY}"
                  - string:
                      scope: GLOBAL
                      id: iid-custom
                      secret: "${IID_CUSTOM}"
                  - usernamePassword:
                      scope: GLOBAL
                      id: ghcr
                      username: "${GHCR_USERNAME}"
                      password: "${GHCR_TOKEN}"
                      description: "GHCR write:packages token"
        unclassified:
          globalLibraries:
            libraries:
              - name: idp-lib
                defaultVersion: demo-setup
                implicit: false
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/deepakbhatt329/demo-spring-app-petclinic.git"
          location:
            url: "http://jenkins.custom-integrartion-ipd-demo.svc:8080/"
          envInject:
            all:
              HARNESS_IM_URL: "${HARNESS_IM_URL}"
              HARNESS_ACCOUNT_ID: "${HARNESS_ACCOUNT_ID}"
              IDP_ENTITY_REF: "component:default/petclinic-demo"
        jobs:
          - script: >
              pipelineJob('petclinic') {
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/deepakbhatt329/demo-spring-app-petclinic.git') }
                        branch('*/demo-setup')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
                triggers { scm('H/2 * * * *') }
              }

agent:
  enabled: true
  namespace: custom-integrartion-ipd-demo
  podRetention: OnFailure

persistence:
  enabled: true
  size: 8Gi

rbac:
  create: true
  readSecrets: true

serviceAccount:
  create: true
  name: jenkins

serviceAccountAgent:
  create: true
  name: jenkins-agent
