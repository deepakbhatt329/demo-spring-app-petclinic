apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-deploy
  namespace: custom-integrartion-ipd-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-deploy
  namespace: custom-integrartion-ipd-demo
subjects:
  - kind: ServiceAccount
    name: jenkins-agent
    namespace: custom-integrartion-ipd-demo
roleRef:
  kind: Role
  name: jenkins-agent-deploy
  apiGroup: rbac.authorization.k8s.io
