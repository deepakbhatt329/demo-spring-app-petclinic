---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-demo
  labels:
    app: petclinic-demo
    idp.harness.io/entity: petclinic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-demo
  template:
    metadata:
      labels:
        app: petclinic-demo
    spec:
      containers:
        - name: petclinic
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: h2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-demo
  labels:
    app: petclinic-demo
spec:
  type: ClusterIP
  selector:
    app: petclinic-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
